; =====================================================================
;  밸런스 설정 파일
;  코드를 몰라도 여기 숫자만 바꾸면 게임이 바뀝니다.
;  (바꾼 뒤 게임을 다시 실행하면 적용돼요)
;  거리 단위는 미터(m), 시간 단위는 초(s)입니다.
; =====================================================================

[player]
; 걷기 / 달리기 / 살금살금(Ctrl) 속도
walk_speed=4.5
run_speed=7.5
sneak_speed=2.2
; 발소리가 술래에게 들리는 거리
walk_noise=9.0
run_noise=22.0
sneak_noise=2.0
; 땡을 받아 풀려난 뒤, 다시 얼음을 쓸 수 있을 때까지 기다리는 시간
freeze_cooldown=3.0
; 얼음 동료에게 이 거리 안으로 붙어 있어야 해동이 진행됨
unfreeze_distance=1.8
; 얼음을 깨는(땡) 데 걸리는 시간. 중간에 떨어지면 처음부터 다시
thaw_time=10.0
; 구르기 (Space): 거리(m), 걸리는 시간, 처음 무적 시간, 쿨타임
roll_distance=3.0
roll_time=0.4
roll_invuln=0.25
roll_cooldown=3.0

[stamina]
; 스태미나: 최대치, 달릴 때 초당 소모 (100 / 5 = 꽉 찬 상태로 약 20초 달리기)
max=100.0
run_drain=5.0
; 회복: 걸을 때 / 서 있을 때 / 얼음 상태일 때 (초당)
walk_regen=15.0
idle_regen=25.0
frozen_regen=40.0
; 구르기 한 번에 드는 양
roll_cost=20.0
; 0이 되면 이만큼 찰 때까지 못 달림. 숨이 찬 동안 숨소리가 술래에게 들리는 거리
recover_at=30.0
breath_noise=8.0

[view]
; 유저 시야: 안개 진하기 (클수록 앞이 안 보임. 0.06이면 20m 앞이 거의 안 보임)
fog_density=0.06
; 카메라 시야각 (작을수록 좁게 보임)
camera_fov=62.0
; 카메라와 캐릭터 사이 거리, 어깨 옆으로 비켜난 정도
camera_distance=2.6
camera_shoulder_offset=0.8
; 발소리가 들리는 최대 거리 (헤드셋으로 위치 파악용)
survivor_step_hear_distance=22.0
seeker_step_hear_distance=32.0
; 술래 발소리 크기: 볼륨(dB, 0 = 원래 크기, 6 = 약 2배), 멀리서도 크게 들리는 정도(클수록 멀리서도 큼, 예전 6)
seeker_step_volume_db=6.0
seeker_step_loudness=10.0

[seeker]
; 술래 수: 스테이지 1~11은 정해진 술래 1마리씩 (11스테이지를 깨면 게임 클리어). 이 값은 그 뒤에 쓸 예비값
count=2
; 술래 속도 (순찰 / 소리 확인하러 갈 때)
patrol_speed=4.4
investigate_speed=5.94
; 추격 속도 = 유저 달리기 속도 × 이 값 (1.375 = 37.5% 빠름. 예전 1.25에서 10% 더). 스킬·패시브는 예외
chase_vs_run=1.375
; 술래 전체 이동속도 배율 (순찰·확인·추격 모두에 곱함. 1.1 = 10% 빠름)
move_speed=1.1
; 술래 시야 (두 단계): 앞쪽 부채꼴 near_sight_range m 안은 바로 알아챔,
; far_sight_range m 까지는 notice_time 초 동안 계속 보여야 알아챔. sight_angle = 좌우 각도 (45 = 전체 90도)
near_sight_range=4.0
far_sight_range=12.0
notice_time=1.5
sight_angle=45.0
; 이 거리 안이면 등 뒤에 있어도 눈치챔
sense_radius=1.8
; 풀숲에 숨은 생존자는 이 거리 안까지 와야 보임
grass_sight_range=2.0
; 이 거리 안의 "움직일 수 있는" 생존자를 잡음
catch_distance=1.3
; 공격 모션: 팔을 휘두르는 시간(이 시간 뒤에도 범위 안이면 잡힘), 휘두른 뒤 멈칫, 내려칠 때 넉넉한 거리
attack_windup=0.08
attack_recover=0.07
attack_extra_reach=0.5
; 공격 속도 배율 (1.1 = 휘두르기·멈칫 시간이 10% 빨라짐)
attack_speed=1.1
; 폭주: 판 시작 후 이 시간(초)이 지나거나 탈출 단계가 되면 공격 속도·이동속도 증가
rage_time=600.0
rage_attack_speed=0.3
rage_move_speed=0.15
; 소리 난 곳에 도착한 뒤 두리번거리는 시간
search_time=2.5
; 쫓던 생존자가 얼음하면 기다리지 않고 이 비율만큼 빨라져서(frozen_boost_time 초) 다른 생존자를 찾으러 감
frozen_boost=0.2
frozen_boost_time=10.0
; (예전 캠핑 시간, 지금은 안 씀)
camp_time=3.5
; 추격 중 시야에서 놓친 뒤 포기하기까지 걸리는 시간
lose_sight_time=3.0
; 술래가 소리를 듣는 거리 배율 (1.3 = 소리가 30% 더 멀리서 들림)
hearing_multiplier=1.3
; 순찰 지점을 고를 때 생존자 근처(대략적인 방향)로 가는 확률과 오차 범위
hunt_chance=0.55
; 이 시간(초) 동안 생존자를 못 만나면 생존자 근처로 더 바짝 압박하며 순찰
pressure_time=15.0
hunt_radius=12.0
; 순찰할 때 아직 안 끝난 봉인석 근처를 둘러볼 확률 (맵이 넓어서 필요)
patrol_generator_chance=0.4
; [똑똑한 AI] 놓친 뒤 근처 숨을 곳(풀숲)을 몇 군데 뒤질지, 그 범위
search_radius=14.0
search_spots=2
; 추격 중 놓치면 도망치던 방향으로 몇 초 앞을 예측해서 감
predict_seconds=1.5
; 순찰할 때 누군가 가동 중인 봉인석을 지킬 확률
guard_working_chance=0.5

[escape]
; 봉인석을 모두 켜면 탈출 단계: 탈출구 수, 제한 시간, 술래가 생존자 위치를 아는 간격
exit_count=2
time_limit=180.0
reveal_interval=10.0
; 탈출구에 이 거리 안으로 들어가면 탈출
exit_radius=2.5
; 탈출구는 멀리서 안 보임: 글씨가 보이는 거리, 바람 소리가 들리는 거리
label_distance=8.0
sound_distance=20.0

[freeze_rule]
; 한 판에 이 번째 얼음부터는 제한 시간 안에 땡을 못 받으면 얼음이 깨지고 탈락 (탈출 단계에서는 무제한)
limit_from=4
shatter_time=60.0

[structure]
; 맵에 세우는 폐가(문·창문·사물함)와 무너진 담장(창문·판자) 개수
shacks=6
walls=10
; 닫힌 문을 술래가 부수는 시간 / 창문 넘는 시간 (생존자, 술래)
door_break_time=2.0
vault_survivor=0.35
vault_seeker=1.3
; 판자: 넘어뜨릴 때 맞은 술래 기절 시간, 술래가 판자를 부수는 시간
pallet_stun=2.0
pallet_break_time=2.5
; 사물함: 이 시간(초) 넘게 숨어 있으면 고양이가 나와서 울음 (술래가 그 소리를 들음)
locker_cat_time=30.0
cat_interval=6.0
cat_noise=45.0
locker_enter_noise=10.0

[ability]
; [상점 공통 능력] 소리 내기 (얼음 상태에서 사용)
noise_cooldown=100.0
noise_range=18.0
noise_max_throw=25.0

[chameleon]
; 능력1 동화: 그 자리에서 움직일 수 없고 술래가 전혀 감지 못함 (부딪히면 탈락). R 다시 누르면 취소
blend_duration=7.5
blend_cooldown=12.5
; 능력2 맵 물들이기: 맵이 내 몸 색으로. 그동안 나만 술래에게 감지 안 됨. 움직일 수 있지만 상호작용 불가
paint_duration=15.0
paint_cooldown=31.25

[space]
; 능력1 랜덤 순간이동
teleport_cooldown=20.0
; 능력2 동료 소환 (얼음 상태 동료도 가능, 얼음은 유지됨)
summon_cooldown=25.0

[cameraman]
; 능력1 플래시: 정면의 술래 2초 스턴 (못 움직이고 못 봄)
photo_cooldown=7.5
photo_stun_time=2.0
photo_range=14.0
photo_angle=30.0
; 능력2 카메라 설치: 카메라 앞을 술래가 지나가면 모두에게 위치 표시
camera_max_charges=3
camera_recharge=25.0
camera_duration=20.0
camera_view_range=16.0
camera_view_angle=40.0

[brute]
; 사나이 능력2 강펀치 (능력1은 패시브: 얼음을 기다림 없이 바로 깸)
punch_cooldown=25.0
; 주먹 길이(앞으로 뻗는 거리)·폭, 맞은 술래가 땅에 떨어진 뒤 기절하는 시간, 빗나갔을 때 쿨타임
punch_range=3.0
punch_width=5.0
; 펀치할 때 카메라가 옆으로 돌아가는 각도 (0 = 안 돌아감)
punch_camera_swing=40.0
punch_stun=1.5
punch_miss_cooldown=3.0

[medic]
; 능력1 치료: 고른 동료가 얼음이면 해동, 아니면 heal_speed 만큼 heal_time 초 이동속도 증가 (중첩 안 됨)
remote_thaw_cooldown=40.0
heal_speed=0.2
heal_time=8.0
; 능력2 붕대 당기기: 조준한 동료를 내 앞으로 당겨옴 (얼음 상태도 가능). 사거리, 쿨타임, 끌려오는 시간
bandage_range=15.0
bandage_cooldown=20.0
bandage_pull_time=0.5

[shadow]
; 능력1 그림자 속으로: 그림자(어두운 곳, 근처 동료·술래의 그림자)에 숨음. 술래가 감지 못함
; (쿨타임은 그림자에서 나온 순간부터 시작. R 다시 누르면 나옴)
shadow_cooldown=30.0
shadow_time=20.0
; 능력2 그림자 건너가기: 그림자 속에서 다른 동료 그림자로 이동하는 쿨타임
hop_cooldown=10.0
; 능력2 (패시브) 조용한 발걸음: 발소리 크기와 술래가 듣는 거리가 이 비율로 줄어듦
quiet_steps=0.5

[hunter]
; 능력1 덫: 최대 trap_max 개 보유, trap_recharge 초마다 1개 충전. 술래가 밟으면 스턴
trap_max=3
trap_recharge=30.0
trap_stun=3.0
trap_life=90.0
; 능력2 핏빛 화살: 화살 수 = 술래 수. 맞은 술래는 계속 피를 흘리고 핏자국은 blood_mark_time 초 남음
arrow_delay=1.0
arrow_speed=45.0
arrow_range=45.0
blood_mark_time=30.0

[bard]
; 두 노래 모두 켜고 끄는 기술 (쿨타임 없음). 노래는 모두에게 실제로 들림
toggle_delay=0.5
song_hear_distance=90.0
; 능력2 신나는 노래: 우리 팀 이동속도 증가
beat_speed=0.15
; 신나는 비트를 켠 악사 본인의 속도 증가
beat_self_speed=0.3

[mechanic]
; 능력1 (패시브) 봉인 가속: 미니게임 한 단계를 깨면 두 단계 진행 (봇은 2배 빠르게)
; 능력2 보급품: 신발/갑옷/헬멧 중 랜덤 1개 (1개만 착용, 깨지면 다시 사용 가능. 신발은 얼음하면 사라짐)
item_delay=1.0
; 신발: 이동속도 증가 / 갑옷·헬멧: 술래 공격 1회 막음 (막은 뒤 잠깐 무적), 헬멧은 마녀 안개도 막음
shoes_speed=0.1
block_invuln=1.0
barricade_time=8.0

[keeper]
; 능력1 길잡이 등불: 안 끝난 봉인석까지 안내. 내가 근처에 있어야 움직임
guide_delay=1.0
guide_speed=3.8
guide_wait_distance=5.0
; 능력2 붉은 탐색광: 술래마다 빛 하나가 날아가 찾으면 wisp_glow_time 초 동안 환하게 빛남
; 빛이 모두 사라진 뒤부터 쿨타임 시작
wisp_cooldown=20.0
wisp_speed=12.0
wisp_glow_time=20.0

[gravity]
; 중력술사
float_cooldown=15.0
float_time=3.0
float_range=16.0
orb_cooldown=15.0
orb_slow=0.6
orb_slow_time=3.0
orb_speed=18.0
orb_range=30.0

; ---------------------------------------------------------------------
;  술래 8종 (매 판 서로 다른 종류로 count 마리 랜덤, 유저에게 알려주지 않음)
; ---------------------------------------------------------------------
; (술래 쿨타임은 모두 예전의 절반으로 줄인 값)
[ghost]
; 유령: 벽 통과(패시브), 벽 속에서는 안 보임
speed_multiplier=1.0
; 대쉬: 멈췄다가 windup초 후 앞으로 돌진. 돌진 중 닿으면 잡힘
dash_cooldown=15.0
dash_windup=1.5
dash_distance=24.0
dash_speed=22.0
; 대쉬를 쓰는 거리 (이 범위 안의 생존자를 보면 사용)
dash_min_range=4.0
dash_max_range=22.0

[butcher]
speed_multiplier=1.0
; 쇠사슬 그랩: 맞으면 술래 앞 pull_to_distance m 까지 끌려옴. 판정이 좁음
chain_cooldown=20.0
chain_range=10.0
chain_speed=48.0
chain_hit_radius=0.45
pull_to_distance=2.0
; 그랩 후 도살자가 잠깐 멈추는 시간 (끌려온 유저가 도망칠 기회)
chain_recover_time=0.8
; 도끼 던지기: 느리게 날아가지만 판정은 넉넉함. 맞으면 피 흘림 + 감속
axe_cooldown=15.0
axe_range=10.0
axe_speed=18.0
axe_hit_radius=0.8
axe_slow=0.5
axe_effect_time=15.0

[rat]
speed_multiplier=1.0
; 쥐 소환: 한 번에 1마리. 돌아다니며 수색하고 물면 피 흘림
summon_cooldown=25.0
minion_life=30.0
minion_speed=5.0
minion_sight=7.0
bite_bleed_time=15.0
; 쥐를 잡을 수 있는 거리 (E)
minion_kill_reach=2.0
; 플라스크: 감속 구역. 최대 3개, 15초마다 1개 충전
flask_max=3
flask_recharge=7.5
flask_range=12.0
flask_radius=3.0
flask_slow=0.4
flask_duration=8.0
; 플라스크를 연달아 던지는 최소 간격
flask_throw_gap=4.0
; 플라스크가 날아가는 시간 (짧을수록 빠름)
flask_flight_time=0.4

[spider]
; 거미 여왕: 거미줄 발사 (맞으면 web_root 초 묶임: 못 움직이고 능력도 못 씀, 얼음만 가능)
speed_multiplier=1.0
web_cooldown=25.0
web_range=14.0
web_speed=28.0
web_root=1.5
; 알 낳기: 간격, 부화 시간, 최대 알 수, 최대 새끼 수
egg_interval=30.0
egg_hatch_time=30.0
egg_max=3
baby_max=4
; 새끼 거미: 사람 달리기 속도 대비 (0.92 = 8% 느림), 거미줄 쿨타임·사거리, 보는 거리
baby_speed_vs_run=0.92
baby_web_cooldown=20.0
baby_web_range=10.0
baby_sight=12.0
; (예전 거미줄 덫 설정, 지금은 안 씀)
web_trap_life=60.0
web_clear_reach=2.2

[mannequin]
; 마네킹: 누가 쳐다보면 굳음. 안 볼 때 unseen_speed 배 빠름
speed_multiplier=1.0
unseen_speed=2.0
; 기습: 아무도 안 볼 때 30m 안 생존자 등 뒤로 순간이동, 나타난 뒤 ambush_freeze 초 못 움직임
ambush_cooldown=2.5
ambush_range=30.0
ambush_freeze=0.5
; 누가 쳐다봐서 굳어 있어도 이 시간(초)만큼 계속 보이면 기습(순간이동)을 써서 시선을 벗어남 (쿨타임은 ambush_cooldown 공유)
